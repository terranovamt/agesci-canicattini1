<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Proposte layout area riservata</title>
<style>
:root{--v:#462678;--y:#FDC500;--vd:#211638;--bg:#f4f1f8}
*{box-sizing:border-box}
body{font:14px/1.4 Montserrat,Arial,sans-serif;margin:0;padding:16px;background:#d9d2e6;color:var(--vd)}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:28px 0 10px;color:var(--v)}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
figcaption{font-weight:700;margin:0 0 6px}figure{margin:0}
.wrap{border:3px solid var(--vd);border-radius:10px;overflow:hidden;background:#fff}
.scr{transform-origin:0 0;background:var(--bg);display:grid;gap:12px;padding:12px;align-content:start;font-size:14px;overflow:hidden}
.card{background:#fff;border:1px solid #d6cce6;border-radius:10px;padding:12px;min-width:0}
.card h3{margin:0 0 4px;font-size:15px}.card p{margin:2px 0;font-size:13px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#5b4a7a;font-weight:700}
.now{background:var(--v);color:#fff;border-color:var(--v)}.now .eyebrow{color:var(--y)}
.alert{background:#fff4c2;border:1px solid var(--y);border-left:6px solid var(--y);border-radius:10px;padding:10px 12px;font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:8px;font-weight:700;background:var(--y);color:var(--vd);padding:0 12px;text-align:center}
.btn.s{background:#fff;border:2px solid var(--v);color:var(--v)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{display:grid;gap:12px;align-content:start;min-width:0}
.top{background:var(--v);color:#fff;padding:10px 14px;border-radius:10px;display:flex;justify-content:space-between;font-weight:700}
.top i{font-style:normal;color:var(--y)}
.menu{background:var(--vd);color:#fff;border-radius:10px;padding:10px;display:grid;gap:6px;align-content:start}
.menu b{font-weight:600;padding:8px;border-radius:6px}.menu b:first-child{background:var(--v);color:var(--y)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--vd);color:#fff;border-radius:10px;text-align:center;align-self:end}
.tabs b{padding:12px 0;font-size:12px}.tabs b:first-child{color:var(--y)}
.search{background:#fff;border:2px solid var(--v);border-radius:10px;min-height:48px;padding:12px;color:#7a6c94}
.li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #eee;font-size:13px}.li:last-child{border:0}
.li span:last-child{color:#5b4a7a;white-space:nowrap}
.pill{display:inline-block;background:#ece6f6;border-radius:99px;padding:2px 8px;font-size:12px;margin:2px 2px 0 0}
</style>
</head>
<body>
<h1>Proposte layout area riservata</h1>
<p>Schermate di prova con dati inventati, in scala ridotta. Consigliate: 1 telefono, 2 tablet, 1 portatile, 2 desktop.</p>
<div id="out"></div>
<script>
const C={
 alert:()=>`<a class="alert">2 passaggi in attesa di conferma →</a>`,
 now:()=>`<div class="card now"><p class="eyebrow">Attività in corso · ora di Roma</p><h3>Gioco notturno</h3><p>Prossimo: 15:30 Merenda · Sede</p><p>Presenze 12/18 · Quote da ricevere 3</p></div>`,
 pres:()=>`<div class="card"><h3>Presenze</h3><p>12 presenti su 18</p><p>Registra in un tocco</p></div>`,
 quote:()=>`<div class="card"><h3>Quote</h3><p>3 soci da saldare</p><p>Totale € 45,00</p></div>`,
 cerca:()=>`<div class="search">Cerca socio per nome o codice…</div>`,
 sc:()=>`<div class="btn">Presenze</div><div class="btn">Quote</div><div class="btn s">Programma</div><div class="btn s">Soci</div>`,
 sc4:()=>`<div class="grid2">${C.sc()}</div>`,
 ev:()=>`<div class="card"><h3>Prossimi eventi</h3><div class="li"><span>Uscita di squadriglia</span><span>sab 14</span></div><div class="li"><span>Riunione Co.Ca.</span><span>mar 17</span></div><div class="li"><span>Cammino di branca</span><span>sab 21</span></div></div>`,
 doc:()=>`<div class="card"><h3>Documenti</h3><div class="li"><span>Programma annuale</span><span>PDF</span></div><div class="li"><span>Regolamento uscite</span><span>PDF</span></div></div>`,
 soci:()=>`<div class="card"><h3>Soci · E/G</h3><div class="li"><span>Socio 01 · Sq. Falchi</span><span>12</span></div><div class="li"><span>Socio 02 · Sq. Lupi</span><span>13</span></div><div class="li"><span>Socio 03 · Sq. Falchi</span><span>11</span></div><div class="li"><span>Socio 04 · Sq. Aquile</span><span>14</span></div></div>`,
 det:()=>`<div class="card"><h3>Socio 02 · Sq. Lupi</h3><p>Saldo quota: € 15,00 da versare</p><p>Presenze: 8 su 10</p><span class="pill">Vice</span><span class="pill">Allergia: segnalata</span></div>`,
 summ:()=>`<div class="card"><h3>Da preparare</h3><p>Corda 20 m ×2 · Tenda ×3</p><h3 style="margin-top:8px">Da comprare</h3><p>Nastro adesivo ×4</p></div>`,
 prog:()=>`<div class="card"><h3>Programma di oggi</h3><div class="li"><span>14:00 Arrivo</span><span>Sede</span></div><div class="li"><span><b>15:30 Gioco notturno</b></span><span>In corso</span></div><div class="li"><span>18:00 Cerchio finale</span><span>Prato</span></div></div>`,
 sqd:n=>`<div class="card"><h3>Sq. ${n}</h3><p>5 membri</p><p>Capo · Vice</p></div>`,
 top:()=>`<div class="top"><span>AGESCI Canicattini 1</span><i>Area riservata</i></div>`,
 menu:()=>`<div class="menu"><b>Home</b><b>Soci</b><b>Attività</b><b>Documenti</b><b>Persone</b></div>`,
 tabs:()=>`<div class="tabs"><b>Home</b><b>Soci</b><b>Attività</b><b>Altro</b></div>`,
 more:()=>`<div class="card"><p><b>Altro ▾</b></p></div>`,
};
const V={
 "Telefono 390×844":[390,844,[
  ["1 · Home a compiti",()=>[C.alert(),C.sc4(),C.more(),C.tabs()]],
  ["2 · Home a flusso",()=>[C.now(),C.alert(),C.quote(),C.ev(),C.tabs()]],
  ["3 · Home a ricerca",()=>[C.cerca(),C.sc4(),C.alert(),C.pres(),C.tabs()]]]],
 "Tablet 820×1180":[820,1180,[
  ["1 · Telefono ampio",()=>[C.alert(),C.now(),C.sc4(),`<div class="grid2">${C.quote()}${C.pres()}</div>`,C.ev(),C.more()]],
  ["2 · Due colonne",()=>[`<div class="grid2"><div class="col">${C.alert()}${C.now()}${C.quote()}</div><div class="col">${C.sc4()}${C.pres()}${C.ev()}</div></div>`,C.doc()]],
  ["3 · Rail laterale",()=>[`<div style="display:grid;grid-template-columns:130px 1fr;gap:12px">${C.menu()}<div class="col">${C.alert()}${C.now()}${C.soci()}${C.ev()}</div></div>`]]]],
 "Portatile 1366×768":[1366,768,[
  ["1 · Menu laterale + 2 colonne",()=>[`<div style="display:grid;grid-template-columns:170px 1fr 1fr;gap:12px">${C.menu()}<div class="col">${C.alert()}${C.now()}${C.pres()}</div><div class="col">${C.quote()}${C.ev()}${C.doc()}</div></div>`]],
  ["2 · Barra alta + 3 colonne",()=>[C.top(),`<div class="grid3"><div class="col">${C.alert()}${C.quote()}${C.pres()}</div><div class="col">${C.now()}${C.prog()}</div><div class="col">${C.sc4()}${C.ev()}</div></div>`]],
  ["3 · Elenco + dettaglio",()=>[`<div style="display:grid;grid-template-columns:170px 1fr 1.1fr;gap:12px">${C.menu()}<div class="col">${C.cerca()}${C.soci()}</div><div class="col">${C.det()}${C.now()}</div></div>`]]]],
 "Desktop 1920×1080":[1920,1080,[
  ["1 · Cruscotto a 4 riquadri",()=>[C.top(),C.alert(),`<div class="grid4">${C.now()}${C.pres()}${C.quote()}${C.soci()}</div>`,`<div class="grid2">${C.ev()}${C.doc()}</div>`]],
  ["2 · Menu + elenco + dettaglio + riepilogo",()=>[`<div style="display:grid;grid-template-columns:190px 1.1fr 1.2fr .8fr;gap:12px">${C.menu()}<div class="col">${C.cerca()}${C.soci()}</div><div class="col">${C.det()}${C.prog()}</div><div class="col">${C.alert()}${C.summ()}${C.quote()}</div></div>`]],
  ["3 · Plancia della branca",()=>[C.top(),`<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px">${[1,2,3,4,5,6].map(C.sqd).join("")}</div>`,`<div class="grid3">${C.prog()}${C.summ()}${C.quote()}</div>`]]]],
};
const out=document.getElementById("out");
for(const [name,[w,h,list]] of Object.entries(V)){
  const target=name.startsWith("Desktop")||name.startsWith("Port")?560:name.startsWith("Tab")?300:230;
  const scale=Math.min(1,target/w);
  out.insertAdjacentHTML("beforeend",`<h2>${name}</h2><div class="row">${list.map(([t,f])=>`<figure><figcaption>${t}</figcaption><div class="wrap" style="width:${w*scale}px;height:${h*scale}px"><div class="scr" style="width:${w}px;height:${h}px;transform:scale(${scale})">${f().join("")}</div></div></figure>`).join("")}</div>`);
}
</script>
</body>
</html>
