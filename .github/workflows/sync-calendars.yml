name: Sync public calendars

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - calendars/sources.json
      - tools/sync-calendars.py
      - tools/calendar-requirements.txt
      - .github/workflows/sync-calendars.yml

permissions:
  contents: read

concurrency:
  group: calendar-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/calendar-requirements.txt
      - run: pip install -r tools/calendar-requirements.txt
      - name: Synchronize feeds
        id: sync
        continue-on-error: true
        run: python tools/sync-calendars.py
      - name: Publish snapshot and explicit feed errors
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendars/events.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: sync public calendar events"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request Pages branch build
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Report incomplete synchronization
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::One or more public feeds failed. See the sync step and the site's status messages."
          exit 1
