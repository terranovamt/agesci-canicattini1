services:
  initialize-data:
    image: node:24-alpine
    user: "0:0"
    command: ["node", "-e", "require('node:fs').chownSync('/data',1000,1000)"]
    volumes:
      - ${NAS_DATA_DIR:-gruppo-data}:/data
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    restart: "no"
  app:
    build:
      context: ./site
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      initialize-data:
        condition: service_completed_successfully
    environment:
      NAS_PUBLIC_ORIGIN: https://terranovamtt.synology.me
      NAS_ADMIN_PASSWORD: ${NAS_ADMIN_PASSWORD:?Compila NAS_ADMIN_PASSWORD in .env}
      NAS_CAPO_CODES: ${NAS_CAPO_CODES:-}
      NAS_TELEMETRY_ENABLED: "true"
      NAS_HOST_PROC: /host/proc
      NAS_RELEASE_REVISION: ${NAS_RELEASE_REVISION:-manual}
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - ${NAS_DATA_DIR:-gruppo-data}:/data
      - /proc/stat:/host/proc/stat:ro
      - /proc/meminfo:/host/proc/meminfo:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  web:
    build:
      context: ./site
      dockerfile: deploy/synology/Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
volumes:
  gruppo-data:
