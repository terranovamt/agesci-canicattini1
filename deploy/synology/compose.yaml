services:
  app:
    image: agesci-nas-app:${NAS_RELEASE_REVISION:-manual}
    build:
      context: ../..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NAS_PUBLIC_ORIGIN: ${NAS_PUBLIC_ORIGIN:?Configure NAS_PUBLIC_ORIGIN in nas.env}
      NAS_ADMIN_PASSWORD: ${NAS_ADMIN_PASSWORD:?Configure NAS_ADMIN_PASSWORD in nas.env}
      NAS_CAPO_CODES: ${NAS_CAPO_CODES:-}
      NAS_TELEMETRY_ENABLED: ${NAS_TELEMETRY_ENABLED:-true}
      NAS_HOST_PROC: ${NAS_HOST_PROC-/host/proc}
      NAS_RELEASE_REVISION: ${NAS_RELEASE_REVISION:-manual}
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - ${NAS_DATA_DIR:-./data}:/data
      - /proc/stat:/host/proc/stat:ro
      - /proc/meminfo:/host/proc/meminfo:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: agesci-nas-web:${NAS_RELEASE_REVISION:-manual}
    build:
      context: ../..
      dockerfile: deploy/synology/Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/tunnel_token"]
    secrets:
      - tunnel_token
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  calendar-sync:
    image: agesci-nas-calendar-sync:${NAS_RELEASE_REVISION:-manual}
    profiles: ["maintenance"]
    build:
      context: ../..
      dockerfile: deploy/synology/calendar.Dockerfile
    volumes:
      - ${NAS_DATA_DIR:-./data}/calendars:/app/calendars
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

secrets:
  tunnel_token:
    file: ${NAS_TUNNEL_TOKEN_FILE:-./tunnel-token.txt}
