server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /setup {
        return 308 /area-riservata/assemblea/setup.html$is_args$args;
    }

    location = /setup.html {
        return 308 /area-riservata/assemblea/setup.html$is_args$args;
    }

    location = /area-riservata.html {
        return 308 /area-riservata/index.html$is_args$args;
    }

    location = /gestione-documenti.html {
        return 308 /area-riservata/documenti.html$is_args$args;
    }

    location = /PEG.html {
        return 308 /peg/index.html$is_args$args;
    }

    location ~ ^/Assemblea-di-Gruppo(?:/(?:index\.html)?)?$ {
        return 308 /area-riservata/assemblea/index.html$is_args$args;
    }

    location ~ ^/(?:Assemblea-di-Gruppo|assemblea)/(setup|regia|guida)\.html$ {
        return 308 /area-riservata/assemblea/$1.html$is_args$args;
    }

    location ~ ^/(?:Assemblea-di-Gruppo|assemblea)/manifest\.webmanifest$ {
        return 308 /area-riservata/assemblea/manifest.webmanifest$is_args$args;
    }

    location ~ ^/PEG(?:/(?:index\.html)?)?$ {
        return 308 /peg/index.html$is_args$args;
    }

    location = /PEG/PEG2628.html {
        return 308 /peg/edizioni/2026-2028.html$is_args$args;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        deny all;
    }

    location ~* /(?:config/site|dati)\.js$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(css|js|webp|avif|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}