log_format nas_safe '$time_iso8601 $request_method $uri $status $request_time';

map $http_x_real_ip $nas_client_ip {
    "" $remote_addr;
    default $http_x_real_ip;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    autoindex off;
    access_log /dev/stdout nas_safe;
    client_max_body_size 28m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $nas_client_ip;

    location ^~ /agesci-canicattini1/api/ {
        proxy_pass http://app:3000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
    }

    location ^~ /agesci-canicattini1/documents/ {
        proxy_pass http://app:3000;
    }

    location = /agesci-canicattini1/area-riservata/assemblea/dati.js {
        proxy_pass http://app:3000;
    }

    location = /agesci-canicattini1/config/site.js {
        proxy_pass http://app:3000;
    }

    location = /agesci-canicattini1/calendars/events.json {
        proxy_pass http://app:3000;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /agesci-canicattini1 {
        return 308 /agesci-canicattini1/$is_args$args;
    }

    location ~ ^/agesci-canicattini1/setup(?:\.html)?$ {
        return 308 /agesci-canicattini1/area-riservata/assemblea/setup.html$is_args$args;
    }

    location = /agesci-canicattini1/area-riservata.html {
        return 308 /agesci-canicattini1/area-riservata/index.html$is_args$args;
    }

    location = /agesci-canicattini1/gestione-documenti.html {
        return 308 /agesci-canicattini1/area-riservata/documenti.html$is_args$args;
    }

    location = /agesci-canicattini1/PEG.html {
        return 308 /agesci-canicattini1/peg/index.html$is_args$args;
    }

    location ~ ^/agesci-canicattini1/Assemblea-di-Gruppo(?:/(?:index\.html)?)?$ {
        return 308 /agesci-canicattini1/area-riservata/assemblea/index.html$is_args$args;
    }

    location ~ ^/agesci-canicattini1/(?:Assemblea-di-Gruppo|assemblea)/(setup|regia|guida)\.html$ {
        return 308 /agesci-canicattini1/area-riservata/assemblea/$1.html$is_args$args;
    }

    location ~ ^/agesci-canicattini1/(?:Assemblea-di-Gruppo|assemblea)/manifest\.webmanifest$ {
        return 308 /agesci-canicattini1/area-riservata/assemblea/manifest.webmanifest$is_args$args;
    }

    location ~ ^/agesci-canicattini1/PEG(?:/(?:index\.html)?)?$ {
        return 308 /agesci-canicattini1/peg/index.html$is_args$args;
    }

    location = /agesci-canicattini1/PEG/PEG2628.html {
        return 308 /agesci-canicattini1/peg/edizioni/2026-2028.html$is_args$args;
    }

    location = /agesci-canicattini1/healthz {
        access_log off;
        proxy_pass http://app:3000;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://app:3000;
    }

    location ~ /\. {
        deny all;
    }

    location ~* /(?:config/site|dati)\.js$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(css|js|webp|avif|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /agesci-canicattini1/ {
        try_files $uri $uri/ $uri.html =404;
    }

    location / {
        return 404;
    }
}